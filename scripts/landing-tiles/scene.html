<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Sans;font-weight:400;src:url(node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2)}
@font-face{font-family:Sans;font-weight:500;src:url(node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2)}
@font-face{font-family:Sans;font-weight:600;src:url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:Sans;font-weight:700;src:url(node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2)}
@font-face{font-family:Serif;font-weight:400;src:url(node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-400-normal.woff2)}
@font-face{font-family:Serif;font-weight:600;src:url(node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-600-normal.woff2)}
:root{--top:#E4EEFB;--bot:#ECE6F7;--card:#fff;--paper:#FBF7EE;--paper1:#F7F2E6;--paper2:#F3EDE0;--label:#1D1D1F;--sup:#5A5A60;--rust:#B85818;--rustT:#9E4A12;--wash:rgb(184 88 24/.12);--ok:#248A3D;--div:rgb(0 0 0/.08);--ctl:#F2F2F4;
--sh:0 2px 4px rgb(0 0 0/.06),0 14px 36px rgb(0 0 0/.10)}
*{box-sizing:border-box;margin:0}
html,body{width:720px;height:900px;overflow:hidden}
body{font-family:Sans;color:var(--label);-webkit-font-smoothing:antialiased}
#s{position:absolute;inset:0;background:linear-gradient(180deg,var(--top),var(--bot));overflow:hidden}
.abs{position:absolute}
.card{background:var(--card);border-radius:28px;box-shadow:var(--sh)}
.paper{background:var(--paper);border-radius:22px;box-shadow:0 1px 2px rgb(0 0 0/.05),0 12px 30px rgb(60 40 10/.10)}
.serif{font-family:Serif}
.sup{color:var(--sup)}
.row{display:flex;align-items:center}
.chip{height:50px;border-radius:25px;padding:0 14px;display:inline-flex;align-items:center;gap:7px;font-size:19px;font-weight:500;border:1.5px solid var(--div);background:#fff}
.cap{height:68px;border-radius:34px;background:var(--rust);color:#fff;font-weight:600;font-size:25px;display:flex;align-items:center;justify-content:center}
.ln{height:14px;border-radius:7px;background:#E7E5E1}
svg.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.opt{height:84px;border-radius:20px;border:2px solid var(--div);display:flex;align-items:center;padding:0 26px;font-size:27px;font-weight:500;background:#fff;gap:16px}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid #C7C7CC;flex:none;display:flex;align-items:center;justify-content:center}
mark{background:none}
</style></head>
<body><div id="s"></div>
<script>
const I={
check:'<path d="M20 6 9 17l-5-5"/>',
file:'<path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
camera:'<path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/>',
link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
play:'<path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/>',
globe:'<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>'};
const ic=(n,s=24,c='currentColor',w=1.75)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" style="color:${c};stroke-width:${w}">${I[n]}</svg>`;
const cl=x=>Math.max(0,Math.min(1,x));
const eo=x=>1-Math.pow(1-x,3);              // ease out
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const sg=(t,a,b,e=eo)=>e(cl((t-a)/(b-a)));   // 0..1 over [a,b]
const L=(a,b,p)=>a+(b-a)*p;
// whole-scene reset at the loop seam: content of the end state fades out and the start state fades in
const seam=(t)=>1;
const typed=(s,p)=>s.slice(0,Math.round(s.length*p));
const P=new URLSearchParams(location.search);
const BEAR=P.get('bear')||'';

/* ---------------- Style A: the app at work (white app cards on the welcome tint) ---------------- */
function A1(t){ // Add a lesson. history
  const url='youtube.com/watch?v=french-revolution';
  const ty=sg(t,0.9,2.6,x=>x), press=t>3.0&&t<3.25?.97:1;
  const gen=sg(t,3.3,3.6), res=sg(t,6.2,6.7), back=seam(t);
  const steps=['Reading the video','Writing your notes','Making flashcards and a quiz'];
  const stepDone=i=>t>3.9+i*0.75;
  const chips=[['play','Video'],['file','PDF'],['globe','Web page'],['camera','Photo']];
  const vidSel=sg(t,0.6,0.9);
  const f=back; // fade factor for seam
  const formOp = (1-res*0)*1;
  return `
  <div class="abs card" style="left:56px;right:56px;top:70px;padding:36px 34px 34px">
    <div style="font-size:24px;font-weight:600">Add a lesson</div>
    <div class="sup" style="font-size:21px;margin-top:6px">Link, file or photo</div>
    <div class="row" style="gap:10px;margin-top:26px;flex-wrap:wrap">
      ${chips.map(([n,l],i)=>{const on=i==0?vidSel*f:0;return `<span class="chip" style="border-color:rgba(184,88,24,${on}) ;background:${on>0.01?`rgba(184,88,24,${.10*on})`:'#fff'};color:${on>.5?'#9E4A12':'#1D1D1F'}">${ic(n,22,on>.5?'#B85818':'#5A5A60')}${l}</span>`}).join('')}
    </div>
    <div class="row" style="margin-top:26px;height:72px;border-radius:18px;border:1.5px solid ${ty>0&&f>.5?'#7C7C80':'rgba(0,0,0,.14)'};padding:0 22px;gap:14px;font-size:23px">
      ${ic('link',24,'#5A5A60')}
      <span style="color:${ty>0&&f>.5?'#1D1D1F':'#5A5A60'};white-space:nowrap;overflow:hidden">${ty>0&&f>.5?typed(url,ty)+(t<2.9&&Math.floor(t*2.4)%2?'<span style="color:#B85818">|</span>':''):'Paste a YouTube link or web page'}</span>
    </div>
    <div class="cap" style="margin-top:22px;transform:scale(${press})">Make my study set</div>
  </div>
  <div class="abs card" style="left:56px;right:56px;top:${L(600,560,gen)}px;padding:30px 34px;opacity:${gen*(1-res)*f}">
    ${steps.map((s,i)=>`<div class="row" style="gap:16px;height:54px;font-size:23px;color:${stepDone(i)?'#1D1D1F':'#5A5A60'}">
      <span style="width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:${stepDone(i)?'#248A3D':'transparent'};border:2px solid ${stepDone(i)?'#248A3D':'#C7C7CC'}">${stepDone(i)?ic('check',20,'#fff',3):''}</span>${s}</div>`).join('')}
    ${BEAR?`<img src="${BEAR}/quizliai_mascot_think.webp" class="abs" style="right:28px;top:26px;width:64px;opacity:${sg(t,3.6,3.9)}">`:''}
  </div>
  <div class="abs card" style="left:56px;right:56px;top:${L(600,560,res)}px;padding:32px 34px;opacity:${res*f}">
    <div class="row" style="gap:12px;font-size:20px;font-weight:600;color:#B85818">${ic('play',20,'#B85818')} HISTORY · VIDEO · 18 MIN</div>
    <div class="serif" style="font-size:38px;font-weight:600;margin-top:12px;line-height:1.15">The French Revolution</div>
    <div class="row" style="gap:10px;margin-top:22px">
      ${['Notes','24 flashcards','10-question quiz'].map(x=>`<span class="chip" style="height:46px;font-size:20px">${x}</span>`).join('')}
    </div>
  </div>`;
}
function A2(t){ // Read the notes. science
  const sc=sg(t,2.2,7.6,eio)*f2(t); // scroll
  const hl=sg(t,1.0,2.0,eio);
  const f=seam(t);
  const bul=['Plants turn light, water and carbon dioxide into sugar.','It happens in the chloroplasts, mostly in the leaves.','Oxygen is released as a by-product.'];
  const sec2=['Light reactions capture energy from sunlight.','The Calvin cycle uses that energy to build glucose.','Less light or water means slower growth.'];
  return `
  <div class="abs card" style="left:56px;right:56px;top:84px;bottom:-40px;overflow:hidden">
   <div style="padding:44px 40px;transform:translateY(${-330*sc}px)">
    <div class="row" style="gap:12px;font-size:20px;font-weight:600;color:#B85818">SCIENCE · NOTES</div>
    <div class="serif" style="font-size:44px;font-weight:600;margin-top:12px;line-height:1.1">Photosynthesis</div>
    <div class="sup" style="font-size:21px;margin-top:12px">From a 1 hr 52 min lecture · 5 min read</div>
    <div style="height:1.5px;background:var(--div);margin:28px 0"></div>
    <div style="font-size:24px;font-weight:600">Key ideas</div>
    ${bul.map((b,i)=>`<div class="row" style="align-items:flex-start;gap:16px;margin-top:18px;font-size:24px;line-height:1.4">
       <span style="width:9px;height:9px;border-radius:50%;background:#B85818;margin-top:13px;flex:none"></span>
       <span>${i==0?`Plants turn <span style="background:linear-gradient(90deg,rgba(184,88,24,.16) ${hl*100}%,transparent ${hl*100}%);border-radius:4px;padding:0 3px">light, water and carbon dioxide</span> into sugar.`:b}</span></div>`).join('')}
    <div class="paper" style="margin-top:30px;padding:26px 28px;box-shadow:none;border:1.5px solid rgba(0,0,0,.05)">
      <div style="font-size:19px;font-weight:600;color:#9E4A12">REMEMBER</div>
      <div class="serif" style="font-size:27px;margin-top:8px;line-height:1.35">Light + water + CO₂ → glucose + oxygen</div>
    </div>
    <div style="font-size:24px;font-weight:600;margin-top:34px">How it works</div>
    ${sec2.map(b=>`<div class="row" style="align-items:flex-start;gap:16px;margin-top:18px;font-size:24px;line-height:1.4"><span style="width:9px;height:9px;border-radius:50%;background:#B85818;margin-top:13px;flex:none"></span><span>${b}</span></div>`).join('')}
   </div>
  </div>
  <div class="abs" style="left:56px;right:56px;bottom:0;height:120px;background:linear-gradient(transparent,#fff);border-radius:0 0 28px 28px"></div>`;
}
function f2(t){return 1-sg(t,8.6,9.6,eio)}  // scroll back to top before the loop
function A3(t){ // Take the quiz. languages
  const qs=[{q:'What does <i>la biblioteca</i> mean?',o:['The bookstore','The library','The bedroom'],a:1,n:3},
            {q:'Pick the word for <i>yesterday</i>.',o:['Mañana','Hoy','Ayer'],a:2,n:4}];
  // q1: tap at 1.6, result to 3.4, slide to q2 at 3.6-4.2, tap at 5.6, slide back to q1 at 8.6-9.4 (loop)
  const s1=sg(t,3.6,4.3,eio), s2=sg(t,8.7,9.5,eio);
  const x = -s1*720 + s2*720;
  const prog=(n)=>n/10;
  const progW = t<3.6?prog(3):t<8.7?L(prog(3),prog(4),s1):L(prog(4),prog(3),s2);
  const card=(Q,i,tap)=>{
    const picked=t>tap&&(i==0? t<8.6 : t<9.6); const pk=sg(t,tap,tap+.25);
    const pr=(t>tap-.2&&t<tap)?.98:1;
    return `<div class="abs card" style="left:${56+i*720}px;width:608px;top:150px;padding:40px 34px;transform:translateX(${x}px)">
      <div class="sup" style="font-size:20px;font-weight:600">SPANISH · QUESTION ${Q.n} OF 10</div>
      <div style="height:8px;border-radius:4px;background:#ECECEF;margin-top:14px;overflow:hidden"><div style="height:100%;width:${progW*100}%;background:#B85818;border-radius:4px"></div></div>
      <div class="serif" style="font-size:36px;font-weight:600;margin-top:30px;line-height:1.25">${Q.q}</div>
      <div style="margin-top:30px;display:flex;flex-direction:column;gap:14px">
      ${Q.o.map((o,j)=>{const ok=picked&&j==Q.a;return `<div class="opt" style="border-color:${ok?`rgba(36,138,61,${pk})`:'rgba(0,0,0,.09)'};transform:scale(${j==Q.a?pr:1})">
        <span class="dot" style="border-color:${ok?'#248A3D':'#C7C7CC'};background:${ok?`rgba(36,138,61,${pk})`:'#fff'}">${ok?ic('check',18,'#fff',3):''}</span>${o}
        ${ok?`<span style="margin-left:auto;font-size:20px;font-weight:600;color:#248A3D;opacity:${pk}">Correct</span>`:''}</div>`}).join('')}
      </div>
      ${BEAR&&i==0?`<img src="${BEAR}/quizliai_mascot_thumbs_up.webp" class="abs" style="right:30px;top:30px;width:58px;opacity:${sg(t,1.75,2.05)*(1-sg(t,3.2,3.5))}">`:''}
    </div>`};
  return card(qs[0],0,1.6)+card(qs[1],1,5.8);
}

/* ---------------- Style B: paper index cards (the deck look from Home) ---------------- */
function deck(left,top,w,h,rot,inner,op=1,extra=''){
  return `<div class="abs" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px;opacity:${op};${extra}">
    <div class="abs paper" style="inset:0;background:var(--paper2);transform:rotate(${rot+4}deg) translate(10px,14px)"></div>
    <div class="abs paper" style="inset:0;background:var(--paper1);transform:rotate(${rot+2}deg) translate(5px,7px)"></div>
    <div class="abs paper" style="inset:0;transform:rotate(${rot}deg);padding:40px 38px">${inner}</div></div>`;
}
function B1(t){
  const srcs=[['play','YouTube video','Storming of the Bastille'],['file','PDF','Chapter 7 · 12 pages'],['camera','Photo','Textbook page 214']];
  const merge=sg(t,3.0,4.2,eio), out=sg(t,4.0,4.6);
  const s=srcs.map((x,i)=>{
    const bob=Math.sin((t*0.9+i*1.3))*5*(1-merge);
    const y0=200+i*150, y=L(y0,330,merge)+bob, sc=L(1,.7,merge);
    return `<div class="abs card row" style="left:${L(100,100,merge)}px;top:${y}px;width:520px;height:116px;border-radius:22px;padding:0 28px;gap:22px;opacity:${1-out};transform:rotate(${(i-1)*-2*(1-merge)}deg) scale(${sc})">
      <span style="width:62px;height:62px;border-radius:50%;background:rgba(184,88,24,.10);display:flex;align-items:center;justify-content:center">${ic(x[0],30,'#B85818')}</span>
      <span><div style="font-size:19px;font-weight:600;color:#5A5A60">${x[1].toUpperCase()}</div><div style="font-size:25px;font-weight:600;margin-top:4px">${x[2]}</div></span></div>`}).join('');
  const d=sg(t,4.2,5.0);
  const inner=`<div style="font-size:19px;font-weight:600;color:#9E4A12">HISTORY</div>
    <div class="serif" style="font-size:42px;font-weight:600;margin-top:16px;line-height:1.15">The French Revolution</div>
    <div class="sup" style="font-size:22px;margin-top:18px">3 sources · 24 cards · 10-question quiz</div>
    <div style="margin-top:36px;display:flex;flex-direction:column;gap:16px"><div class="ln" style="width:92%"></div><div class="ln" style="width:78%"></div><div class="ln" style="width:85%"></div></div>`;
  return s+deck(100,L(310,250,d),520,400,-1.5,inner,d,`transform:scale(${L(.94,1,d)})`);
}
function B2(t){
  const f=seam(t);
  const lines=[['Plants turn ',' light, water and CO₂ ',' into sugar.'],['It happens in the ','chloroplasts',', mostly in leaves.'],['Oxygen is released as a ','by-product','.']];
  const w=(i)=>sg(t,1.0+i*1.3,1.9+i*1.3,eio);
  const inner=`<div style="font-size:19px;font-weight:600;color:#9E4A12">SCIENCE · 5 MIN READ</div>
   <div class="serif" style="font-size:44px;font-weight:600;margin-top:14px;line-height:1.1">Photosynthesis</div>
   <div class="sup" style="font-size:21px;margin-top:10px">From a 1 hr 52 min lecture</div>
   <div style="margin-top:34px;display:flex;flex-direction:column;gap:24px">
   ${lines.map((l,i)=>{const p=w(i)*f;return `<div class="serif" style="font-size:28px;line-height:1.4">${l[0]}<span style="background:linear-gradient(90deg,rgba(184,88,24,.20) ${p*100}%,transparent ${p*100}%);border-radius:4px">${l[1]}</span>${l[2]}</div>`}).join('')}
   </div>
   <div style="margin-top:34px;padding-top:24px;border-top:1.5px dashed rgba(0,0,0,.14)" class="row"><span style="font-size:21px;font-weight:600;color:#9E4A12">Light + water + CO₂ → glucose + O₂</span></div>`;
  return deck(70,150,580,600,-1,inner,1,`transform:translateY(${L(0,-6,Math.sin(t/10*Math.PI*2)*.5+.5)}px)`);
}
function B3(t){
  const ang=sg(t,1.0,1.8,eio)*180;
  const sw=sg(t,3.2,4.0,eio);              // flashcard out, quiz in
  const front=`<div style="font-size:19px;font-weight:600;color:#9E4A12">SPANISH · CARD 3 OF 24</div><div class="serif" style="font-size:64px;font-weight:600;margin-top:110px;text-align:center">la biblioteca</div><div class="sup" style="text-align:center;font-size:21px;margin-top:20px">Tap to flip</div>`;
  const backc=`<div style="font-size:19px;font-weight:600;color:#9E4A12">SPANISH · CARD 3 OF 24</div><div class="serif" style="font-size:64px;font-weight:600;margin-top:110px;text-align:center">the library</div><div class="sup" style="text-align:center;font-size:21px;margin-top:20px">“Voy a la biblioteca.”</div>`;
  const tap=5.4, pk=sg(t,tap,tap+.25), pr=(t>tap-.2&&t<tap)?.97:1;
  const opts=['The bookstore','The library','The bedroom'];
  const quiz=`<div style="font-size:19px;font-weight:600;color:#9E4A12">SPANISH · QUIZ · QUESTION 3 OF 10</div>
    <div style="height:8px;border-radius:4px;background:rgba(0,0,0,.07);margin-top:14px;overflow:hidden"><div style="height:100%;width:${L(20,30,pk)}%;background:#B85818;border-radius:4px"></div></div>
    <div class="serif" style="font-size:38px;font-weight:600;margin-top:30px;line-height:1.25">What does <i>la biblioteca</i> mean?</div>
    <div style="margin-top:28px;display:flex;flex-direction:column;gap:14px">
    ${opts.map((o,j)=>{const ok=j==1&&pk>0;return `<div class="opt" style="height:80px;border-color:${ok?`rgba(36,138,61,${pk})`:'rgba(0,0,0,.09)'};transform:scale(${j==1?pr:1})">
      <span class="dot" style="border-color:${ok?'#248A3D':'#C7C7CC'};background:${ok?`rgba(36,138,61,${pk})`:'#fff'}">${ok?ic('check',18,'#fff',3):''}</span>${o}
      ${ok?`<span style="margin-left:auto;font-size:20px;font-weight:600;color:#248A3D;opacity:${pk}">Correct</span>`:''}</div>`}).join('')}
    </div>`;
  return `
  <div class="abs" style="left:90px;top:200px;width:540px;height:440px;perspective:1600px;transform:translateX(${-720*sw}px) rotate(${-4*sw}deg)">
    <div class="abs paper" style="inset:0;background:var(--paper2);transform:rotate(3deg) translate(10px,12px)"></div>
    <div class="abs paper" style="inset:0;background:var(--paper1);transform:rotate(1.5deg) translate(5px,6px)"></div>
    <div class="abs" style="inset:0;transform-style:preserve-3d;transform:rotateY(${ang}deg)">
      <div class="abs paper" style="inset:0;padding:40px 38px;backface-visibility:hidden">${front}</div>
      <div class="abs paper" style="inset:0;padding:40px 38px;backface-visibility:hidden;transform:rotateY(180deg)">${backc}</div>
    </div>
  </div>
  <div class="abs paper" style="left:70px;top:150px;width:580px;height:560px;padding:40px 36px;transform:translateX(${720*(1-sw)}px) rotate(${2*(1-sw)}deg)">${quiz}
    ${BEAR?`<img src="${BEAR}/quizliai_mascot_thumbs_up.webp" class="abs" style="right:-14px;bottom:-70px;width:96px;opacity:${sg(t,5.6,5.9)*(1-sg(t,7.6,8.0))}">`:''}
  </div>`;
}
const S={a1:A1,a2:A2,a3:A3,b1:B1,b2:B2,b3:B3};
window.draw=(key,t)=>{const x=sg(t,9.2,9.9,eio);
document.getElementById('s').innerHTML=`<div class="abs" style="inset:0;opacity:${1-x}">${S[key](Math.min(t,9.2))}</div>`+(x>0?`<div class="abs" style="inset:0;opacity:${x}">${S[key](0)}</div>`:'')};
if(P.get('k')) draw(P.get('k'),+P.get('t')||0);
</script></body></html>
