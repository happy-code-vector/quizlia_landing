# Firebase web config is public by design (access is controlled by Firebase
# Security Rules, not by hiding these values). Next.js inlines NEXT_PUBLIC_*
# vars into the client bundle at build time, so Netlify's secrets scanner
# flags them in the build output. Omit these keys from the scan — all other
# secrets are still scanned.
[build.environment]
  # Node 22.12+ natively supports require() of ES modules, which the
  # firebase-admin -> jwks-rsa (CJS) -> jose@6 (ESM-only) chain needs when
  # Netlify's function runtime resolves it from raw node_modules (builds +
  # functions share NODE_VERSION on Netlify).
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_APPCHECK_RECAPTCHA_SITE_KEY"
  # Netlify's pattern-based "smart detection" false-positives on the
  # Firebase web API key (AIza...), which is public by design and must be
  # in the client bundle for Firebase web to work at all. The definite-
  # secrets scan (env-var value matching for GEMINI_API_KEY, Stripe, etc.)
  # remains fully active.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
